# nginx site config for agbacorp.com
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/agbacorp.com
#   sudo ln -s /etc/nginx/sites-available/agbacorp.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d agbacorp.com -d www.agbacorp.com
#
# Certbot rewrites this file to add the TLS block and the HTTP->HTTPS
# redirect, so install it BEFORE running certbot.

server {
    listen 80;
    listen [::]:80;
    server_name agbacorp.com www.agbacorp.com;

    # Certificates and drawings uploaded through the control panel can be
    # large. The app caps uploads at 50 MB; leave headroom above that or
    # nginx rejects the request before Next ever sees it.
    client_max_body_size 55M;

    # A batch certificate can take a moment to stream on a slow line.
    proxy_read_timeout 120s;

    # Next already gzips its own payloads; this covers the rest.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Immutable build assets — safe to cache hard, they are content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else, including the gated file route. Note there is no
    # caching here on purpose: /api responses must never be held by a proxy.
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
